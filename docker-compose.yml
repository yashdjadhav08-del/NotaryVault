services:
  notaryvault-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: notaryvault-api
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - NODE_ENV=production
      - PORT=5001
      - STORAGE_DIR=/app/storage
      - UPLOADS_DIR=/app/storage/uploads
      - DATABASE_PATH=/app/storage/notaryvault.db
      - ALLOWED_ORIGINS=http://localhost:5173,https://notary-vault-woad.vercel.app,https://notaryvault.vercel.app
      - PUBLIC_APP_URL=https://notary-vault-woad.vercel.app
      # Optional Notification Providers (Configure in your production .env)
      - EMAIL_PROVIDER=${EMAIL_PROVIDER:-resend}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - EMAIL_FROM=${EMAIL_FROM:-NotaryVault <onboarding@resend.dev>}
      - SMS_PROVIDER=${SMS_PROVIDER:-twilio}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      - TWILIO_FROM_NUMBER=${TWILIO_FROM_NUMBER:-}
      # Blockchain RPC Endpoints
      - MST_TESTNET_RPC_URL=${MST_TESTNET_RPC_URL:-https://testnetrpc.mstblockchain.com}
      - MST_MAINNET_RPC_URL=${MST_MAINNET_RPC_URL:-https://mariorpc.mstblockchain.com}
    volumes:
      - notaryvault-data:/app/storage

volumes:
  notaryvault-data:
    driver: local
